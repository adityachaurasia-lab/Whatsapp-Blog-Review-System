version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-blog-bot
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

